# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0.20261122"
  python_check_max: "3.15"

package:
  name: types-cffi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-cffi/types_cffi-${{ version }}.tar.gz
  sha256: 6525d3c871f6346718d90204c3bef93861b1732531ea18582015a12474a625fb

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - types-setuptools

tests:
  - package_contents:
      strict: true
      site_packages:
        - _cffi_backend-stubs/*.{pyi,toml,typed}
        - cffi-stubs/*.pyi
        - types_cffi-${{ version }}.dist-info/**
  - python:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - cffi
        - mypy
    script:
      - mypy -p cffi -p _cffi_backend

about:
  summary: Typing stubs for cffi
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed
  repository: https://github.com/python/typeshed/tree/main/stubs/cffi

extra:
  recipe-maintainers:
    - bollwyvl
    - conda-forge/mypy
